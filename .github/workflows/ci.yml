name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '27.0'
      - name: Report build environment
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
      - name: Resolve locked dependencies
        run: swift package resolve
      - name: Test
        run: swift test --disable-automatic-resolution
      - name: Validate packaging scripts and plist
        run: |
          bash -n scripts/bundle.sh scripts/sign.sh scripts/notarize.sh scripts/prepare-release.sh scripts/sign-release.sh scripts/generate-icon.sh Resources/dmg/create-template.sh Resources/dmg/test-packaging.sh scripts/make-dmg.sh scripts/check-dmg.sh site/deploy.sh site/infra/provision.sh
          plutil -lint Resources/Info.plist
          xmllint --noout Resources/AppIcon.svg
      - name: Test Sparkle public-key preflight with disposable keys
        run: swift scripts/test-sparkle-key.swift
      - name: Build development bundle
        env:
          BUILD_ARCH: arm64
        run: bash scripts/bundle.sh
      - name: Build and verify drag-to-Applications disk image
        run: |
          set -euo pipefail
          bash scripts/make-dmg.sh "dist/Mergeport.app" dist/Mergeport.dmg
          bash scripts/check-dmg.sh dist/Mergeport.dmg
      - name: Archive bundle for artifact round-trip
        run: ditto -c -k --keepParent "dist/Mergeport.app" dist/Mergeport-build.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-bundle
          path: dist/Mergeport-build.zip
          if-no-files-found: error
          retention-days: 1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-bundle
          path: dist/artifact-roundtrip
      - name: Verify artifact round-trip
        run: |
          set -euo pipefail
          cmp dist/Mergeport-build.zip dist/artifact-roundtrip/Mergeport-build.zip
          ditto -x -k dist/artifact-roundtrip/Mergeport-build.zip dist/artifact-roundtrip
          APP="dist/artifact-roundtrip/Mergeport.app"
          FRAMEWORK="$APP/Contents/Frameworks/Sparkle.framework"
          test -x "$APP/Contents/MacOS/Mergeport"
          test -L "$FRAMEWORK/Versions/Current"
          test -L "$FRAMEWORK/Sparkle"
          test -x "$FRAMEWORK/Versions/Current/Autoupdate"
          codesign --verify --deep --strict "$APP"
